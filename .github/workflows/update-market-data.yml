name: Atualizar dados de mercado

# Roda 1x por dia, antes da abertura do pregão da B3 (10h em Brasília):
#  1. Busca preço atual e indicadores fundamentalistas dos tickers em
#     src/data/watchlist.json (scripts/update-market-data.mjs) e salva em
#     src/data/marketSnapshot.json.
#  2. Roda o screening mecânico (scripts/screening-report.mjs): testa TODAS
#     as estratégias de risco definido do app em TODOS os tickers da
#     watchlist, com prêmios estimados, e salva em
#     src/data/screeningSnapshot.json — não aparece em nenhuma tela do
#     app, é só para consulta interna na hora de revisar a carteira
#     recomendada.
#
# Isto NÃO gera nem altera a carteira recomendada (estruturas/teses) —
# só atualiza números de mercado e o screening mecânico. Também dá pra
# disparar manualmente pela aba Actions do GitHub ("Run workflow").
on:
  schedule:
    # 12:00 UTC = 09:00 no horário de Brasília (UTC-3 o ano todo, sem
    # horário de verão desde 2019).
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Buscar preços e fundamentos atuais
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: node scripts/update-market-data.mjs

      - name: Rodar screening mecânico (todas as estratégias × todos os tickers)
        run: node scripts/screening-report.mjs

      - name: Commitar snapshots atualizados (se houve mudança)
        run: |
          if git diff --quiet -- src/data/marketSnapshot.json src/data/screeningSnapshot.json; then
            echo "Sem mudanças de preço/fundamentos/screening hoje."
            exit 0
          fi
          git config user.name "rco-dash-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/marketSnapshot.json src/data/screeningSnapshot.json
          git commit -m "chore: atualiza cotações, fundamentos e screening ($(date -u +%Y-%m-%d))"
          git push
